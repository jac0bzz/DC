<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    
    <!-- 🛡️ FIX GITHUB PAGES: Inyecta la ruta base dinámicamente para que no se rompan las imágenes ni los links -->
    <script>
        (function() {
            var repoBase = '/';
            if (window.location.hostname.includes('github.io')) {
                var parts = window.location.pathname.split('/');
                if (parts.length > 1 && parts[1] !== '') {
                    repoBase = '/' + parts[1] + '/';
                }
            }
            document.write('<base href="' + window.location.origin + repoBase + '">');
        })();
    </script>
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Ruta No Encontrada | D&C STANDARDS</title>
    
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="static/Icono.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #030303;
            --card-metal: linear-gradient(135deg, #1f1f1f 0%, #0d0d0d 100%);
            --white: #FFFFFF;
            --oil-gold: #E5A93C; 
            --mid-gray: #888888;
            --border-alpha: rgba(255, 255, 255, 0.08);
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            background-color: var(--bg-dark);
            color: var(--white);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            perspective: 2000px;
        }

        .background-wrapper {
            position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%;
        }
        .background-wrapper img {
            width: 100%; height: 100%; object-fit: cover;
            filter: brightness(0.15) contrast(1.2); 
        }
        .vignette {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(229, 169, 60, 0.08) 0%, rgba(0,0,0,0.95) 75%);
        }

        .error-container {
            width: 90vw;
            max-width: 500px;
            background: var(--card-metal);
            border: 1px solid var(--border-alpha);
            border-radius: 24px;
            padding: clamp(2rem, 6vw, 3.5rem);
            box-shadow: 0 40px 80px rgba(0,0,0,0.95), inset 0 1px 2px rgba(255,255,255,0.1);
            text-align: center;
            position: relative;
            opacity: 0;
            transform: translateY(20px);
            animation: emergeBox 0.6s var(--ease-out-expo) forwards;
        }

        @keyframes emergeBox {
            to { opacity: 1; transform: translateY(0); }
        }

        .wireframe-rig {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; color: var(--oil-gold); opacity: 0.04; z-index: 1; pointer-events: none;
        }

        .error-code {
            font-size: clamp(4rem, 15vw, 6rem);
            font-weight: 900;
            color: var(--oil-gold);
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 0.5rem;
            position: relative;
            z-index: 2;
            text-shadow: 0 10px 30px rgba(229, 169, 60, 0.1);
        }

        .error-title {
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            position: relative;
            z-index: 2;
        }

        .error-desc {
            font-size: 0.95rem;
            color: var(--mid-gray);
            line-height: 1.6;
            font-weight: 300;
            margin-bottom: 2.5rem;
            position: relative;
            z-index: 2;
        }

        .btn-home {
            position: relative;
            z-index: 5;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 1.1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: var(--white);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s var(--ease-out-expo);
        }

        .btn-home:hover {
            background: var(--oil-gold);
            color: #000000;
            border-color: var(--oil-gold);
            box-shadow: 0 15px 30px rgba(229, 169, 60, 0.2);
            transform: translateY(-2px);
        }

        .redirect-timer {
            margin-top: 1.8rem;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
        }
        #countdown {
            color: var(--oil-gold);
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .error-container { padding: 2.5rem 1.5rem; border-radius: 20px; }
        }
    </style>
</head>
<body>

    <div class="background-wrapper">
        <!-- Gracias al script del <head>, esto siempre apuntará a la raíz correcta -->
        <img src="static/Hero.png" alt="Fondo Industrial">
        <div class="vignette"></div>
    </div>

    <main class="error-container">
        
        <svg viewBox="0 0 300 450" class="wireframe-rig">
            <g stroke="currentColor" fill="none">
                <ellipse cx="150" cy="400" rx="90" ry="25" stroke-width="1" opacity="0.3"/>
                <path d="M 110 330 L 135 60 M 190 330 L 165 60" stroke-width="2"/>
                <path d="M 113 300 L 187 270 M 187 300 L 113 270" stroke-width="0.8" opacity="0.6"/>
                <path d="M 116 270 L 184 240 M 184 270 L 116 240" stroke-width="0.8" opacity="0.6"/>
                <line x1="150" y1="60" x2="150" y2="400" stroke-width="1.5"/>
            </g>
        </svg>

        <div class="error-code">404</div>
        <h1 class="error-title">Ruta No Encontrada</h1>
        <p class="error-desc">El enlace operativo al que intenta acceder no existe o fue movido de los servidores centrales de la compañía.</p>

        <!-- El botón también se arregla automáticamente -->
        <a href="index.html" class="btn-home">
            <i class="fa-solid fa-arrow-left-long"></i> Volver al Inicio
        </a>

        <div class="redirect-timer">
            Redirección automática en <span id="countdown">7</span> segundos...
        </div>

    </main>

    <script>
        let secondsLeft = 7;
        const countdownElement = document.getElementById('countdown');

        const interval = setInterval(() => {
            secondsLeft--;
            countdownElement.textContent = secondsLeft;

            if (secondsLeft <= 0) {
                clearInterval(interval);
                // La redirección JavaScript también queda protegida por la etiqueta base
                window.location.href = "index.html";
            }
        }, 1000);
    </script>

</body>
</html>
